[project]
name = "lab06-job-communication"
version = "1.0.0"
description = "Lab 6：分布式作业的时间花在哪，以及怎么省"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy>=1.26"]

# 默认的占位计算只用标准库；numpy 只有 --compute numpy 时才用到。
# 环境准备（仓库根目录）：uv sync --project 2026/experiments/06 --frozen
# 离线测试：cd 2026/experiments/06 && uv run --frozen python -m unittest -v
# 测量需要 root 与实验床：sudo python3 2026/experiments/06/jobrun.py ...
